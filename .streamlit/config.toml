# Streamlit Community Cloud deployment config (Streamlit 1.40.0).
# client.disableDataExport is unsupported in 1.40.0; do not enable it here.

[server]
# Disable file watchers in Cloud to avoid Linux inotify watch-limit crashes.
# Automatic source hot-reload is not needed for the deployed application.
fileWatcherType = "none"
# 정적 파일 제공 비활성화
enableStaticServing = false

# 최대 업로드 크기 (MiB).
# 실제 값은 runtime.yaml 의 limits.max_upload_size_mib 와 동기화한다.
# prepare-runtime 명령 (작업 17)이 이 값을 자동으로 생성한다.
# maxUploadSize = 10   # 작업 17에서 runtime.yaml 로부터 채운다.

[theme]
# 기본 테마 사용 (한국어 화면에 맞게 작업 5에서 조정 가능)
base = "light"
