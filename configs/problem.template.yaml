# problem.template.yaml — 문제 설정 원형 (개인정보·실측값 없음)
#
# 실제 설정은 configs/local/problem.yaml 에 작성한다 (Git 제외).
# 변수명·단위·측정 기준은 데이터 확보 후 확정한다.
# 이 원형 파일에는 실제 변수명이나 측정값을 넣지 않는다.

schema_version: 1
problem_id: null          # 실제 문제 ID (예: "waste-pyrolysis-v1")

# status 가능 값:
#   draft      — 파일 구조·필수 키 존재 여부 확인 가능. 학습·예측 실행 불가.
#   configured — inputs·targets 가 정의되어 학습 준비 완료. 웹 예측은 배포 묶음 필요.
status: draft

# 입력 변수 목록 (데이터 확보 후 정의)
# 각 항목의 구조는 아래 주석을 참고한다.
#
# - id: 내부 식별자 (영문, 밑줄)
#   label_ko: 한국어 이름
#   description: 변수 의미 설명
#   role: feedstock | preparation | reaction_test
#   dtype: int | float | category | bool
#   unit: 단위 (무차원이면 null)
#   basis: 산출 기준 (해당 없으면 null)
#   required: true | false
#   missing_policy: null (필수 변수) 또는 학습 시 확정한 결측 처리 방법
#   allowed_categories: []  # dtype=category 일 때 필수
#   physical_constraints: []
#   display_order: 0
inputs: []

# 예측 대상 목록 (데이터 확보 후 정의)
# 각 항목의 구조는 아래 주석을 참고한다.
#
# - id: 내부 식별자
#   label_ko: 한국어 이름
#   family: gas | liquid | functional_group | pore | performance
#   task: regression | binary_classification
#   definition: 수치·분류의 의미
#   unit: 단위 (무차원이면 null)
#   input_ids: []  # 이 모델이 실제로 사용하는 입력 ID
#   output_constraints:
#     non_negative: false
#     finite: true
targets: []

# 조성 그룹 (해당하는 경우 정의)
composition_groups: []

# 물리적 입력 제약 (데이터 확보 후 정의)
# 학습 범위와 별개로 물리적으로 허용되지 않는 조건을 기록한다.
physical_constraints: []

# 적용 대상 설명 (원료·공정·반응 범위)
applicability:
  description: null
  feedstock_types: []
  process_conditions: []
  reaction_types: []
