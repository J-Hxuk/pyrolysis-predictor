name: Biochar Streamlit deployment smoke

on:
  pull_request:
    paths:
      - "pyrolysis/biochar_ui/**"
      - "pyrolysis/biochar_stage2/**"
      - "pyrolysis/biochar_stage1/**"
      - "tests/test_v141_ui_ux.py"
      - "tests/test_stage1_hgb_v134.py"
      - "tests/test_stage2_blend_v139.py"
      - "tests/test_manufacturing_rank_v140.py"
      - ".gitattributes"
      - ".github/workflows/biochar-deployment-smoke.yml"
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deployment dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4
      - name: Unit and model regression checks
        run: |
          python -m pytest -q --tb=short tests/test_stage1_hgb_v134.py tests/test_v141_ui_ux.py tests/test_stage2_blend_v139.py tests/test_manufacturing_rank_v140.py
      - name: Load Streamlit unified screen without legacy v15 archive
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("biochar_stage2_app.py", default_timeout=180).run()
          if app.exception:
              raise AssertionError("Streamlit startup exceptions: " + repr(list(app.exception)))
          if not app.text_input:
              raise AssertionError("Unified Streamlit page did not render any inputs")
          print("Streamlit startup smoke passed")
          PY
